name: Federated Temp User Janitor - Build, publish and release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment
        required: true
        default: test
        type: choice
        options:
          - test
          - prod

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    name: Build and publish Federated Temp User Janitor
    uses: ./.github/workflows/.build-publish-docker.yaml
    with:
      image_name: ${{ github.repository }}
      context: .
      environment: ${{ inputs.environment }}

  create-release:
    if: github.ref == 'refs/heads/main' && inputs.environment == 'prod'
    needs: build-publish
    permissions:
      contents: write
    uses: ./.github/workflows/.create-release.yaml
